<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://kit.fontawesome.com/6e51d6c25a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles/style.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
  </head>
  <body>
    <div class="appScreen">
      <div class="dateText">
        <span id="dayOfWeek"></span>
        <span id="date"></span>
      </div>
      <div class="searchContainer">
        <input type="search" placeholder="Поиск..." />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <div class="filterData">
        <button id="allTasks" name="all"><i class="fa-solid fa-check"></i><span> Все</span></button>
        <button id="activTasks" name="activ">
          <i class="fa-solid fa-check"></i><span> Активные</span>
        </button>
        <button id="compleatedTasks" name="compleated">
          <i class="fa-solid fa-check"></i><span> Завершенные</span>
        </button>
      </div>
      <div class="tasksList">
        <!-- сюда кидаем таски из js -->
        <!-- <div class="task">
          <input type="checkbox" />
          <div><span>date</span><span>task</span></div>
        </div>-->
        <button id="addNewTaskBtn"><i class="fa-solid fa-pencil"></i></button>
      </div>
    </div>
    <div class="modalWindow" hidden="true">
      <form id="addTaskForm">
        <img id="dragHandle" src="./assets/icons/Drag handle.svg" alt="Drag handle.svg" />
        <div class="dataInputs">
          <input name="description" type="text" placeholder="Описание" />
          <input name="date" type="text" placeholder="Дата" />
        </div>
        <div class="remindMeContainer">
          <span>Напомнить мне</span>
          <img src="./assets/icons/Switch.svg" alt="Switch.svg" />
        </div>
        <div></div>
        <div class="buttonContainer">
          <input type="submit" value="Добавить" />
          <input name="resetBtn" type="reset" value="Отмена" />
        </div>
      </form>
    </div>
  </body>
  <script src="/scripts/script.js"></script>
</html>
